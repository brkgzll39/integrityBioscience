<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Integrity text -->
  <text x="0" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0a1f3f">Integrity</text>

  <!-- Bioscience text -->
  <text x="0" y="72" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#0a2d52">Bioscience</text>

  <!-- DNA Helix -->
  <g transform="translate(250, 25)">
    <!-- Left strand -->
    <path d="M 0 0 Q -8 8, 0 16" stroke="#2ba5ab" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right strand -->
    <path d="M 0 0 Q 8 8, 0 16" stroke="#2ba5ab" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Connecting lines -->
    <line x1="-3" y1="4" x2="3" y2="4" stroke="#2ba5ab" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="12" x2="3" y2="12" stroke="#2ba5ab" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>