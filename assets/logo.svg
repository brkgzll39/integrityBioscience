<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400">
  <!-- Integrity text -->
  <text x="60" y="180" font-family="Sora, Arial, sans-serif" font-size="140" font-weight="800" fill="#0a1f3f" letter-spacing="-3">Integrity</text>

  <!-- Bioscience text -->
  <text x="60" y="280" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="500" fill="#0a2d52" letter-spacing="2">Bioscience</text>

  <!-- DNA Helix - Right side -->
  <g transform="translate(1000, 100)">
    <!-- Top dots -->
    <circle cx="80" cy="0" r="18" fill="#0a1f3f"/>
    <circle cx="120" cy="20" r="14" fill="#0a1f3f"/>
    <circle cx="160" cy="5" r="12" fill="#0a1f3f"/>

    <!-- DNA double helix strands -->
    <path d="M 60 60 Q 100 80, 140 60 T 220 60" stroke="#2ba5ab" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 60 60 Q 20 80, -20 60 T 60 60" stroke="#2ba5ab" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- DNA rungs -->
    <line x1="60" y1="60" x2="30" y2="80" stroke="#2ba5ab" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="75" x2="70" y2="95" stroke="#2ba5ab" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="60" x2="110" y2="80" stroke="#2ba5ab" stroke-width="8" stroke-linecap="round"/>
    <line x1="180" y1="70" x2="150" y2="90" stroke="#2ba5ab" stroke-width="8" stroke-linecap="round"/>

    <!-- Bottom curve -->
    <path d="M 60 120 Q 100 140, 140 120" stroke="#2ba5ab" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
</svg>
