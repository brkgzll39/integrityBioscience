<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0a1f3f"/>

  <!-- DNA Helix -->
  <g transform="translate(25, 35)">
    <!-- Left strand -->
    <path d="M 0 0 Q -12 12, 0 24" stroke="#2ba5ab" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Right strand -->
    <path d="M 0 0 Q 12 12, 0 24" stroke="#2ba5ab" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Connecting lines -->
    <line x1="-4" y1="6" x2="4" y2="6" stroke="#2ba5ab" stroke-width="3" stroke-linecap="round"/>
    <line x1="-4" y1="18" x2="4" y2="18" stroke="#2ba5ab" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2ba5ab" text-anchor="middle">IB</text>
</svg>
